name: Build Gojo Blue MAX frame sheet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-gojo-blue-max-sprites.yml"

permissions:
  contents: write

jobs:
  build-frame-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install AVIF and WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavif-bin

      - name: Extract all 41 AVIF sequence frames and build the sprite sheet
        shell: bash
        run: |
          set -euo pipefail

          source_file="jjs-2d/gojo-blue-max-phase-animation.avif"
          output_file="jjs-2d/gojo-blue-max-frames.webp"
          
          work_dir="$RUNNER_TEMP/gojo-blue-max-frames"
          mkdir -p "$work_dir"

          test -f "$source_file"

          # FFmpeg currently treats this AVIF sequence as one still image.
          # libavif's --index all explicitly extracts every AVIF sequence frame.
          avifdec --info "$source_file"
          avifdec --index all "$source_file" "$work_dir/frame.png"

          extracted_count="$(find "$work_dir" -maxdepth 1 -type f -name 'frame-*.png' | wc -l | tr -d ' ')"
          echo "Extracted AVIF frames: $extracted_count"
          if [ "$extracted_count" != "41" ]; then
            echo "Expected 41 frames from AVIF sequence, got $extracted_count"
            ls -lah "$work_dir"
            exit 1
          fi

          for frame in "$work_dir"/frame-*.png; do
            dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$frame" | head -n 1)"
            if [ "$dimensions" != "205x205" ]; then
              echo "Expected 205x205 frame, got $dimensions from $frame"
              exit 1
            fi
          done

          # Five columns by nine rows; the final four cells are unused.
          ffmpeg -hide_banner -y -framerate 20 -i "$work_dir/frame-%010d.png" \
            -vf "format=rgba,tile=5x9:padding=0:margin=0:color=black@0" \
            -frames:v 1 -c:v libwebp -lossless 1 -compression_level 6 "$output_file"

          sheet_dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$output_file" | head -n 1)"
          if [ "$sheet_dimensions" != "1025x1845" ]; then
            echo "Expected 1025x1845 sprite sheet, got $sheet_dimensions"
            exit 1
          fi

          echo "Created $output_file ($(wc -c < "$output_file") bytes)"

      - name: Commit generated frame sheet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jjs-2d/gojo-blue-max-frames.webp
          git rm -f jjs-2d/gojo-blue-max-frames.webp.b64 || true
          if git diff --cached --quiet; then
            echo "Frame sheet is already up to date."
            exit 0
          fi
          git commit -m "Generate Gojo Blue MAX frame sheet"
          git push
