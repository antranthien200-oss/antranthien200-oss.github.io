name: Multiplayer server tests

on:
  push:
    paths:
      - "jjs-2d/index.html"
      - "multiplayer-server/**"
      - ".github/workflows/multiplayer-server-tests.yml"
  pull_request:
    paths:
      - "jjs-2d/index.html"
      - "multiplayer-server/**"
      - ".github/workflows/multiplayer-server-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install multiplayer server dependencies
        working-directory: multiplayer-server
        run: npm install
      - name: Run server and browser syntax tests
        working-directory: multiplayer-server
        run: npm test
