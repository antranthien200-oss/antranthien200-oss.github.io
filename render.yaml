services:
  - type: web
    name: balls-shenanigan-online
    runtime: node
    plan: free
    region: singapore
    rootDir: multiplayer-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
